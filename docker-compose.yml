version: '3.8'

services:
  # Development service
  react-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    network_mode: "host"
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    profiles:
      - dev

  # Production service
  react-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: unless-stopped
    profiles:
      - prod

  # Optional: Add a reverse proxy (nginx)
  nginx-proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - react-app
    profiles:
      - prod
