<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3a1fc"/>
      <stop offset="100%" stop-color="#ffb6c1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main rounded square -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Checklist items -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- First item -->
    <rect x="12" y="16" width="8" height="8" rx="2" ry="2" fill="#fff"/>
    <polyline points="14,20 16,22 20,18" stroke="#7c79fd" fill="none" stroke-width="2"/>
    <line x1="24" y1="20" x2="44" y2="20" stroke="#fff" stroke-width="3"/>
    
    <!-- Second item -->
    <rect x="12" y="28" width="8" height="8" rx="2" ry="2" fill="#fff"/>
    <polyline points="14,32 16,34 20,30" stroke="#7c79fd" fill="none" stroke-width="2"/>
    <line x1="24" y1="32" x2="44" y2="32" stroke="#fff" stroke-width="3"/>
    
    <!-- Third item -->
    <rect x="12" y="40" width="8" height="8" rx="2" ry="2" fill="#fff"/>
    <line x1="24" y1="44" x2="44" y2="44" stroke="#fff" stroke-width="3"/>
  </g>
  
  <!-- Decorative element -->
  <circle cx="48" cy="16" r="6" fill="#fff" opacity="0.3"/>
</svg>